<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAS(S) Exam Duty Portal</title>
  <style>
    :root {
      --navy: #17365d;
      --navy2: #244a76;
      --yellow: #ffd966;
      --yellow2: #fff2cc;
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #cbd5e1;
      --green: #e2f0d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      background: var(--navy);
      color: white;
      padding: 20px;
      border-bottom: 6px solid var(--yellow);
    }

    .header-inner {
      max-width: 980px;
      margin: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    .status {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .container {
      max-width: 980px;
      margin: auto;
      padding: 18px;
    }

    .panel {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: var(--navy);
    }

    input, select, button, a.action {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      font-size: 1rem;
    }

    input, select {
      border: 1px solid var(--line);
      padding: 9px 11px;
      background: white;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button, a.action {
      border: none;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .primary {
      background: var(--yellow);
      color: var(--navy);
    }

    .secondary {
      background: var(--navy);
      color: white;
    }

    .outline {
      background: white;
      color: var(--navy);
      border: 1px solid var(--navy);
    }

    .result-title {
      color: var(--navy);
      margin: 22px 0 10px;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 10px;
      border-left: 7px solid var(--navy);
      padding: 14px 16px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.07);
    }

    .card.start {
      border-left-color: #d6a700;
      background: #fffdf4;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .teacher-raw {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
    }

    .time {
      font-weight: 700;
      color: var(--navy);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #4b5563;
      font-size: 0.92rem;
    }

    .badge {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-start {
      background: var(--yellow);
      color: var(--navy);
    }

    .badge-end {
      background: var(--green);
      color: #335c21;
    }

    .badge-both {
      background: #e8def8;
      color: #56328c;
    }

    .variant {
      margin-top: 8px;
      display: inline-block;
      background: var(--yellow2);
      border: 1px solid #e6c85c;
      color: #6b5600;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .next {
      margin-top: 8px;
      font-size: 0.92rem;
    }

    .empty {
      background: white;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 18px;
      color: var(--muted);
    }

    .suggestions {
      margin-top: 10px;
    }

    .suggestions button {
      width: auto;
      margin: 4px 4px 0 0;
      min-height: 36px;
      padding: 6px 10px;
    }

    @media (max-width: 700px) {
      .controls, .actions {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <h1>SAS(S) Exam Duty Portal</h1>
      <div id="status" class="status">Loading live duty data...</div>
    </div>
  </div>

  <div class="container">
    <section class="panel">
      <div class="controls">
        <div>
          <label for="teacherInput">Teacher Name</label>
          <input id="teacherInput" list="teacherList" placeholder="Type your name">
          <datalist id="teacherList"></datalist>
        </div>

        <div>
          <label for="dateSelect">Exam Day</label>
          <select id="dateSelect">
            <option value="">All dates</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="findBtn" class="primary">Find My Duties</button>
<button id="clearBtn" class="outline">Clear</button>
<button id="refreshBtn" class="secondary">Refresh Live Data</button>
        <a class="action secondary"
           href="https://docs.google.com/spreadsheets/d/1fi80AzaVvbl1kqj2GbAsGl_1Uq8gJnyONLyJppGAqds/"
           target="_blank"
           rel="noopener noreferrer">Exam Schedule</a>
      </div>
    </section>

    <section id="results"></section>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxhCKbxEUuVRZ4INGBRbFgutlJ8COVKuzbz1QSHN-OatjsnYAtAuzZg7v1b3sVeyDQ2Sg/exec";

let data = null;
let duties = [];
let teacherGroups = [];
let dates = [];

document.getElementById("findBtn").addEventListener("click", findDuties);
document.getElementById("clearBtn").addEventListener("click", clearAll);

document.getElementById("refreshBtn").addEventListener("click", async () => {
  document.getElementById("status").textContent = "Refreshing live data...";
  await loadData();
});
document.getElementById("teacherInput").addEventListener("keydown", e => {
  if (e.key === "Enter") findDuties();
});

const CACHE_KEY = "examDutyPortalData";
const CACHE_DATE_KEY = "examDutyPortalCacheDate";

async function initialLoad() {
  const now = new Date();
  const cached = localStorage.getItem(CACHE_KEY);

  if (cached) {
    try {
      data = JSON.parse(cached);

      duties = Array.isArray(data.duties) ? data.duties : [];
      teacherGroups = Array.isArray(data.teachers) ? data.teachers : [];
      dates = Array.isArray(data.dates) ? data.dates : [];

      populateTeachers();
      populateDates();

      const savedData = data;
      const generatedAt = new Date(savedData.generatedAt);

      const sameDay =
        generatedAt.toDateString() === now.toDateString();

      const cacheAfter8 =
        sameDay && generatedAt.getHours() >= 8;

      const before8am =
        now.getHours() < 8;

      document.getElementById("status").textContent =
        `Showing saved data · Updated ${formatDateTime(savedData.generatedAt)}`;

      if (before8am || !cacheAfter8) {
        try {
          const response = await fetch(API_URL, { cache: "no-store" });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const latestData = await response.json();

          const oldDuties =
            JSON.stringify(savedData.duties || []);

          const newDuties =
            JSON.stringify(latestData.duties || []);

          if (oldDuties !== newDuties) {
            localStorage.setItem(
              CACHE_KEY,
              JSON.stringify(latestData)
            );

            localStorage.setItem(
              CACHE_DATE_KEY,
              todayKey()
            );

            document.getElementById("status").textContent =
              "New duty data available · Refresh to view";

            const refreshNow = window.confirm(
              "New duty data is available.\n\nPress OK to refresh and view the latest duties."
            );

            if (refreshNow) {
              window.location.reload();
            }
          } else {
            localStorage.setItem(
              CACHE_KEY,
              JSON.stringify(latestData)
            );

            localStorage.setItem(
              CACHE_DATE_KEY,
              todayKey()
            );

            document.getElementById("status").textContent =
              `Latest duty data checked · Updated ${formatDateTime(latestData.generatedAt)}`;
          }

        } catch (error) {
          console.error("Background update check failed:", error);

          document.getElementById("status").textContent =
            `Showing saved data · Live update check unavailable`;
        }
      }

      return;

    } catch (e) {
      console.error("Cache read failed:", e);
    }
  }

  await loadData();
}

function todayKey() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

async function loadData() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(API_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    data = await response.json();

    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_DATE_KEY, todayKey());

    duties = Array.isArray(data.duties) ? data.duties : [];
    teacherGroups = Array.isArray(data.teachers) ? data.teachers : [];
    dates = Array.isArray(data.dates) ? data.dates : [];

    populateTeachers();
    populateDates();

    status.textContent =
      `Live data · ${data.dutyBlockCount ?? duties.length} duty blocks · Updated ${formatDateTime(data.generatedAt)}`;

  } catch (error) {
    console.error(error);

    status.textContent = "Unable to load live duty data.";

    document.getElementById("results").innerHTML =
      '<div class="empty">Duty data could not be loaded. Please refresh later.</div>';
  }
}

initialLoad();

function populateTeachers() {
  const list = document.getElementById("teacherList");
  list.innerHTML = "";

  teacherGroups.forEach(group => {
    const option = document.createElement("option");
    option.value = group.name;
    list.appendChild(option);
  });
}

function populateDates() {
  const select = document.getElementById("dateSelect");
  const current = select.value;

  select.innerHTML = '<option value="">All dates</option>';

  dates.forEach(date => {
    const option = document.createElement("option");
    option.value = date;
    option.textContent = date;
    select.appendChild(option);
  });

  if (dates.includes(current)) {
    select.value = current;
  }
}

function findDuties() {
  const input = document.getElementById("teacherInput").value;
  const date = document.getElementById("dateSelect").value;
  const groupName = resolveGroupName(input);

  if (!input.trim()) {
    showMessage("Enter a teacher name.");
    return;
  }

  if (!groupName) {
    const suggestions = nearestGroups(input, 5);

    let html = '<div class="empty">No exact teacher match found.';

    if (suggestions.length) {
      html += '<div class="suggestions"><strong>Did you mean:</strong><br>' +
        suggestions.map(name =>
          `<button class="outline" onclick="chooseTeacher('${escapeJs(name)}')">${escapeHtml(name)}</button>`
        ).join("") +
        '</div>';
    }

    html += '</div>';
    document.getElementById("results").innerHTML = html;
    return;
  }

  document.getElementById("teacherInput").value = groupName;

  const items = duties
    .filter(d => d.teacherGroup === groupName)
    .filter(d => !date || d.dateLabel === date)
    .sort(compareDuties);

  renderTeacherDuties(groupName, items);
}

function renderTeacherDuties(groupName, items) {
  if (!items.length) {
    showMessage(`No duties found for ${groupName}.`);
    return;
  }

  const grouped = groupBy(items, d => d.dateLabel);
  let html = "";

  Object.keys(grouped).forEach(date => {
    html += `<h2 class="result-title">${escapeHtml(date)}</h2><div class="cards">`;

    grouped[date].forEach(duty => {
      const next = getNextInvigilator(duty);
      const variant = duty.teacherRaw !== duty.teacherGroup;
      const classes = duty.startPaper ? "card start" : "card";

      html += `
        <div class="${classes}">
          <div class="card-head">
            <div class="teacher-raw">${escapeHtml(duty.teacherRaw)}</div>
            <div class="time">${escapeHtml(duty.startTime)}–${escapeHtml(duty.endTime)}</div>
          </div>

          <div class="meta">
            <span><strong>Venue:</strong> ${escapeHtml(duty.venue || "")}</span>
            <span><strong>TG:</strong> ${escapeHtml(duty.tg || "")}</span>
            <span><strong>Duty Stage:</strong> ${escapeHtml(stageText(duty))}</span>

            ${duty.startPaper && duty.paperStartTime
              ? `<span><strong>Paper Starts:</strong> ${escapeHtml(duty.paperStartTime)}</span>`
              : ""}
          </div>

          <div class="next"><strong>Next Invigilator:</strong> ${escapeHtml(next)}</div>

          ${stageBadge(duty)}

          ${variant
            ? `<div class="variant">Name in Google Sheet: ${escapeHtml(duty.teacherRaw)} · grouped under ${escapeHtml(duty.teacherGroup)}</div>`
            : ""}
        </div>
      `;
    });

    html += "</div>";
  });

  document.getElementById("results").innerHTML = html;
}

function getNextInvigilator(duty) {
  const normalizeVenue = value =>
    String(value || "")
      .replace(/\u00A0/g, "")
      .replace(/\s+/g, "")
      .replace(/[*#]/g, "")
      .toUpperCase();

  const normalizeTG = value =>
    String(value || "")
      .replace(/\u00A0/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .toUpperCase();

  const candidates = duties.filter(d =>
    d.dateLabel === duty.dateLabel &&
    normalizeVenue(d.venue) === normalizeVenue(duty.venue) &&
    normalizeTG(d.tg) === normalizeTG(duty.tg) &&
    d.startTime === duty.endTime
  );

  if (!candidates.length) {
    return "-";
  }

  const uniqueGroups = [...new Set(candidates.map(d => d.teacherGroup))];

  if (uniqueGroups.length === 1 && uniqueGroups[0] === duty.teacherGroup) {
    return "Continues";
  }

  const names = [];

  candidates.forEach(d => {
    if (!names.includes(d.teacherRaw)) {
      names.push(d.teacherRaw);
    }
  });

  return names.join(" / ");
}

function stageText(duty) {
  if (duty.startPaper && duty.endPaper) return "Start & End";
  if (duty.startPaper) return "Start";
  if (duty.endPaper) return "End";
  return "—";
}

function stageBadge(duty) {
  if (duty.startPaper && duty.endPaper) {
    return '<span class="badge badge-both">Start & End Paper</span>';
  }

  if (duty.startPaper) {
    return '<span class="badge badge-start">Start Paper</span>';
  }

  if (duty.endPaper) {
    return '<span class="badge badge-end">End Paper</span>';
  }

  return "";
}

function resolveGroupName(input) {
  const raw = String(input || "");
  const normalized = normalizeName(raw);

  for (const group of teacherGroups) {
    if (normalizeName(group.name) === normalized) {
      return group.name;
    }

    if (Array.isArray(group.variants)) {
      for (const variant of group.variants) {
        if (normalizeName(variant) === normalized) {
          return group.name;
        }
      }
    }
  }

  return "";
}

function nearestGroups(input, limit) {
  const query = normalizeName(input);

  if (!query) return [];

  return teacherGroups
    .filter(group => isSearchableTeacherName(group.name))
    .map(group => {
      const name = normalizeName(group.name);
      const words = name.split(" ").filter(Boolean);

      let rank = 5;
      let score = levenshtein(query, name);

      if (name === query) {
        rank = 0;
        score = 0;
      } else if (name.startsWith(query)) {
        rank = 1;
        score = name.length - query.length;
      } else if (words.some(word => word.startsWith(query))) {
        rank = 2;
        score = Math.min(
          ...words
            .filter(word => word.startsWith(query))
            .map(word => word.length - query.length)
        );
      } else if (name.includes(query)) {
        rank = 3;
        score = name.indexOf(query);
      } else if (query.includes(name)) {
        rank = 4;
        score = query.length - name.length;
      }

      return {
        name: group.name,
        rank,
        score
      };
    })
    .sort((a, b) =>
      a.rank - b.rank ||
      a.score - b.score ||
      a.name.localeCompare(b.name)
    )
    .slice(0, limit)
    .map(x => x.name);
}

function isSearchableTeacherName(value) {
  const s = normalizeName(value);

  if (!s) return false;

  if (!/[a-z]/i.test(s)) return false;

  return true;
}

function chooseTeacher(name) {
  document.getElementById("teacherInput").value = name;
  findDuties();
}

function clearAll() {
  document.getElementById("teacherInput").value = "";
  document.getElementById("dateSelect").value = "";
  document.getElementById("results").innerHTML = "";
}

function compareDuties(a, b) {
  const dateA = dates.indexOf(a.dateLabel);
  const dateB = dates.indexOf(b.dateLabel);

  if (dateA !== dateB) return dateA - dateB;

  const timeA = timeToMinutes(a.startTime);
  const timeB = timeToMinutes(b.startTime);

  if (timeA !== timeB) return timeA - timeB;

  if ((a.venue || "") !== (b.venue || "")) {
    return String(a.venue || "").localeCompare(String(b.venue || ""));
  }

  return String(a.teacherRaw || "").localeCompare(String(b.teacherRaw || ""));
}

function timeToMinutes(value) {
  const s = String(value || "").trim().toUpperCase();
  const match = s.match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?$/);

  if (!match) return 9999;

  let hour = Number(match[1]);
  const minute = Number(match[2]);
  const ampm = match[3];

  if (ampm === "PM" && hour !== 12) hour += 12;
  if (ampm === "AM" && hour === 12) hour = 0;

  return hour * 60 + minute;
}

function normalizeName(value) {
  return String(value || "")
    .replace(/\u00A0/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function levenshtein(a, b) {
  const previous = Array.from({ length: b.length + 1 }, (_, i) => i);

  for (let i = 1; i <= a.length; i++) {
    const current = [i];

    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;

      current[j] = Math.min(
        current[j - 1] + 1,
        previous[j] + 1,
        previous[j - 1] + cost
      );
    }

    for (let j = 0; j <= b.length; j++) {
      previous[j] = current[j];
    }
  }

  return previous[b.length];
}

function groupBy(items, keyFn) {
  return items.reduce((acc, item) => {
    const key = keyFn(item);
    (acc[key] ||= []).push(item);
    return acc;
  }, {});
}

function showMessage(message) {
  document.getElementById("results").innerHTML =
    `<div class="empty">${escapeHtml(message)}</div>`;
}

function formatDateTime(value) {
  if (!value) return "now";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeJs(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}
</script>
</body>
</html>
