<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAS(S) Exam Duty Portal</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #1f4e78;
      --accent-soft: #eaf2f8;
      --start: #fff4cc;
      --end: #e8f5e9;
      --danger: #fef2f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
      color: var(--accent);
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 1rem;
    }

    input, select {
      padding: 8px 10px;
      background: white;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    button.secondary {
      background: white;
      color: var(--accent);
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .view-tabs button {
      width: auto;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .duty-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 6px solid var(--accent);
      border-radius: 10px;
      padding: 14px;
    }

    .duty-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .teacher {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .time {
      font-weight: 700;
      color: var(--accent);
    }

    .meta {
      display: flex;
      gap: 10px 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .badge.start {
      background: var(--start);
      color: #7c5a00;
    }

    .badge.end {
      background: var(--end);
      color: #256029;
    }

    .badge.both {
      background: #ede9fe;
      color: #5b21b6;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 18px;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      background: var(--accent-soft);
      position: sticky;
      top: 0;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 1.45rem;
      }
    }

    @media print {
      body {
        background: white;
      }

      .controls, .view-tabs, .status {
        display: none !important;
      }

      .panel {
        border: none;
        padding: 0;
      }

      .duty-card {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SAS(S) Exam Duty Portal</h1>
      <div id="status" class="status">Loading live duty data...</div>
    </header>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="teacherInput">Teacher</label>
          <input id="teacherInput" list="teacherList" placeholder="Type teacher name">
          <datalist id="teacherList"></datalist>
        </div>

        <div>
          <label for="dateSelect">Exam Day</label>
          <select id="dateSelect">
            <option value="">All dates</option>
          </select>
        </div>

        <button id="findBtn">Find Duties</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
    </section>

    <div class="view-tabs">
      <button id="myViewBtn">Teacher View</button>
      <button id="masterViewBtn" class="secondary">Full Master View</button>
      <button id="printBtn" class="secondary">Print</button>
    </div>

    <section id="teacherView"></section>
    <section id="masterView" class="hidden"></section>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxhCKbxEUuVRZ4INGBRbFgutlJ8COVKuzbz1QSHN-OatjsnYAtAuzZg7v1b3sVeyDQ2Sg/exec';

let apiData = null;
let duties = [];
let teachers = [];
let dates = [];
let currentTeacher = "";
let currentDate = "";

document.getElementById("findBtn").addEventListener("click", showTeacherView);
document.getElementById("clearBtn").addEventListener("click", clearFilters);
document.getElementById("myViewBtn").addEventListener("click", () => switchView("teacher"));
document.getElementById("masterViewBtn").addEventListener("click", () => switchView("master"));
document.getElementById("printBtn").addEventListener("click", () => window.print());

loadData();

async function loadData() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(API_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    apiData = await response.json();
    duties = Array.isArray(apiData.duties) ? apiData.duties : [];
    teachers = Array.isArray(apiData.teachers) ? apiData.teachers : uniqueSorted(duties.map(d => d.teacher));
    dates = Array.isArray(apiData.dates) ? apiData.dates : uniqueInOrder(duties.map(d => d.dateLabel));

    populateTeacherList();
    populateDateList();

    status.textContent =
      `Live data loaded · ${apiData.dutyBlockCount ?? duties.length} duty blocks · Updated ${formatGeneratedTime(apiData.generatedAt)}`;

    renderEmptyTeacherView();
  } catch (error) {
    console.error(error);
    status.textContent = "Failed to load live duty data.";
    document.getElementById("teacherView").innerHTML =
      '<div class="empty">Unable to load exam duty data. Please refresh the page later.</div>';
  }
}

function populateTeacherList() {
  const list = document.getElementById("teacherList");
  list.innerHTML = "";

  teachers.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    list.appendChild(option);
  });
}

function populateDateList() {
  const select = document.getElementById("dateSelect");
  select.innerHTML = '<option value="">All dates</option>';

  dates.forEach(date => {
    const option = document.createElement("option");
    option.value = date;
    option.textContent = date;
    select.appendChild(option);
  });
}

function showTeacherView() {
  const typedName = document.getElementById("teacherInput").value;
  const date = document.getElementById("dateSelect").value;

  currentTeacher = resolveTeacherName(typedName);
  currentDate = date;

  switchView("teacher");

  if (!typedName.trim()) {
    renderEmptyTeacherView("Enter a teacher name.");
    return;
  }

  if (!currentTeacher) {
    const suggestions = nearestTeachers(typedName, 5);

    let html = '<div class="empty">No exact teacher match found.';

    if (suggestions.length) {
      html += '<br><br>Closest matches:<br>' +
        suggestions.map(name =>
          `<button class="secondary" style="width:auto;margin:4px" onclick="selectSuggestion('${escapeJs(name)}')">${escapeHtml(name)}</button>`
        ).join("");
    }

    html += '</div>';
    document.getElementById("teacherView").innerHTML = html;
    return;
  }

  const filtered = duties
    .filter(d => d.teacher === currentTeacher)
    .filter(d => !currentDate || d.dateLabel === currentDate)
    .sort(compareDuties);

  renderDutyCards(filtered, currentTeacher);
}

function selectSuggestion(name) {
  document.getElementById("teacherInput").value = name;
  showTeacherView();
}

function renderDutyCards(items, teacherName) {
  const container = document.getElementById("teacherView");

  if (!items.length) {
    container.innerHTML =
      `<div class="empty">No duties found for ${escapeHtml(teacherName)}${currentDate ? " on " + escapeHtml(currentDate) : ""}.</div>`;
    return;
  }

  const grouped = groupBy(items, d => d.dateLabel);

  let html = "";

  Object.keys(grouped).forEach(date => {
    html += `<h2>${escapeHtml(date)}</h2><div class="cards">`;

    grouped[date].forEach(duty => {
      html += dutyCardHtml(duty);
    });

    html += "</div>";
  });

  container.innerHTML = html;
}

function dutyCardHtml(duty) {
  const badge = dutyBadgeHtml(duty);

  return `
    <div class="duty-card">
      <div class="duty-head">
        <div class="teacher">${escapeHtml(duty.teacher)}</div>
        <div class="time">${escapeHtml(duty.startTime)}–${escapeHtml(duty.endTime)}</div>
      </div>
      <div class="meta">
        <span><strong>Venue:</strong> ${escapeHtml(duty.venue || "")}</span>
        <span><strong>TG:</strong> ${escapeHtml(duty.tg || "")}</span>
        <span><strong>Periods:</strong> ${escapeHtml(String(duty.periodCount ?? ""))}</span>
      </div>
      ${badge}
    </div>
  `;
}

function dutyBadgeHtml(duty) {
  if (duty.startPaper && duty.endPaper) {
    return '<span class="badge both">Start & End Paper</span>';
  }

  if (duty.startPaper) {
    return '<span class="badge start">Start Paper</span>';
  }

  if (duty.endPaper) {
    return '<span class="badge end">End Paper</span>';
  }

  return "";
}

function switchView(view) {
  const teacherView = document.getElementById("teacherView");
  const masterView = document.getElementById("masterView");
  const myBtn = document.getElementById("myViewBtn");
  const masterBtn = document.getElementById("masterViewBtn");

  if (view === "master") {
    teacherView.classList.add("hidden");
    masterView.classList.remove("hidden");
    myBtn.classList.add("secondary");
    masterBtn.classList.remove("secondary");
    renderMasterView();
  } else {
    masterView.classList.add("hidden");
    teacherView.classList.remove("hidden");
    masterBtn.classList.add("secondary");
    myBtn.classList.remove("secondary");
  }
}

function renderMasterView() {
  const container = document.getElementById("masterView");
  const date = document.getElementById("dateSelect").value;

  const items = duties
    .filter(d => !date || d.dateLabel === date)
    .sort(compareDuties);

  if (!items.length) {
    container.innerHTML = '<div class="empty">No duties found.</div>';
    return;
  }

  let html = `
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Teacher</th>
            <th>Venue</th>
            <th>TG</th>
            <th>Stage</th>
          </tr>
        </thead>
        <tbody>
  `;

  items.forEach(d => {
    let stage = "";

    if (d.startPaper && d.endPaper) stage = "Start & End";
    else if (d.startPaper) stage = "Start";
    else if (d.endPaper) stage = "End";

    html += `
      <tr>
        <td>${escapeHtml(d.dateLabel)}</td>
        <td>${escapeHtml(d.startTime)}–${escapeHtml(d.endTime)}</td>
        <td>${escapeHtml(d.teacher)}</td>
        <td>${escapeHtml(d.venue || "")}</td>
        <td>${escapeHtml(d.tg || "")}</td>
        <td>${stage}</td>
      </tr>
    `;
  });

  html += "</tbody></table></div>";
  container.innerHTML = html;
}

function clearFilters() {
  document.getElementById("teacherInput").value = "";
  document.getElementById("dateSelect").value = "";
  currentTeacher = "";
  currentDate = "";
  switchView("teacher");
  renderEmptyTeacherView();
}

function renderEmptyTeacherView(message = "Enter a teacher name to view duties.") {
  document.getElementById("teacherView").innerHTML =
    `<div class="empty">${escapeHtml(message)}</div>`;
}

function resolveTeacherName(input) {
  const raw = String(input || "");
  if (!raw) return "";

  const exact = teachers.find(name => name === raw);
  if (exact) return exact;

  const lower = raw.toLowerCase();
  const ciExact = teachers.find(name => name.toLowerCase() === lower);
  return ciExact || "";
}

function nearestTeachers(input, limit) {
  const raw = String(input || "").trim().toLowerCase();
  if (!raw) return [];

  return teachers
    .map(name => ({
      name,
      score: levenshtein(raw, name.toLowerCase())
    }))
    .sort((a, b) => a.score - b.score || a.name.localeCompare(b.name))
    .slice(0, limit)
    .map(x => x.name);
}

function compareDuties(a, b) {
  const dateOrderA = dates.indexOf(a.dateLabel);
  const dateOrderB = dates.indexOf(b.dateLabel);

  if (dateOrderA !== dateOrderB) {
    return dateOrderA - dateOrderB;
  }

  const timeA = timeToMinutes(a.startTime);
  const timeB = timeToMinutes(b.startTime);

  if (timeA !== timeB) {
    return timeA - timeB;
  }

  if ((a.venue || "") !== (b.venue || "")) {
    return String(a.venue || "").localeCompare(String(b.venue || ""));
  }

  return String(a.teacher || "").localeCompare(String(b.teacher || ""));
}

function timeToMinutes(value) {
  const s = String(value || "").trim().toUpperCase();
  const match = s.match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?$/);

  if (!match) return 9999;

  let hour = Number(match[1]);
  const minute = Number(match[2]);
  const ampm = match[3];

  if (ampm === "PM" && hour !== 12) hour += 12;
  if (ampm === "AM" && hour === 12) hour = 0;

  return hour * 60 + minute;
}

function groupBy(items, keyFn) {
  return items.reduce((acc, item) => {
    const key = keyFn(item);
    (acc[key] ||= []).push(item);
    return acc;
  }, {});
}

function uniqueSorted(items) {
  return [...new Set(items.filter(Boolean))].sort();
}

function uniqueInOrder(items) {
  return [...new Set(items.filter(Boolean))];
}

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () =>
    Array(b.length + 1).fill(0)
  );

  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;

      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }

  return dp[a.length][b.length];
}

function formatGeneratedTime(value) {
  if (!value) return "now";

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleString();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeJs(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}
</script>
</body>
</html>
