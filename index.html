<style>

body{

.header{

#lastUpdated{

.form-group{

}

select,
input{

}

select{

}

input{

}

.button-row{

button{

}

button:hover{

}

.primary{

#status{

#resultTitle{

}

}

.suggestion:hover{

}

#tableWrapper{
    background:white;

}

table{

}

thead th{
    position:sticky;

}

th,
td{

}

tbody tr:nth-child(even){

}

.sticky-column{

}

thead .sticky-column{

}

.session-title{

body{

select,

id="teacherInput"

Loading...

<script>

/* ===========================================================
   CONFIG
=========================================================== */

const CONFIG = {

    daysFile:"days.json",

    teacherKeyword:"teacher",

    lessonCode:"L",

    ignoreLesson:true

};

/* ===========================================================
   GLOBAL DATA
=========================================================== */

let rawCSV = [];

let teacherIndex = {};

let teacherSchedules = {};

let teacherNames = [];

let examSchedule = [];

let timeSlots = [];

let currentCSV = "";

let teacherRow = -1;

let headerRow = -1;

let teacherStartRow = -1;

let timeColumns = [];

let examHeader = [];

let examSections = [];

let examPapers = [];

let dutyDetailsIndex = Object.create(null);

let dutyVenueIndex = Object.create(null);

/* ===========================================================
   INITIALIZATION
=========================================================== */

window.addEventListener("load", initialise);

async function initialise(){

    registerEvents();

    await loadDays();

}

/* ===========================================================
   EVENTS
=========================================================== */

function registerEvents(){

    document
        .getElementById("btnSearch")
        .addEventListener("click", ()=>searchTeacher());

    document
        .getElementById("btnExam")
        .addEventListener("click", displayExamSchedule);

    document
        .getElementById("btnMaster")
        .addEventListener("click", displayMasterView);

    document
        .getElementById("btnPrint")
        .addEventListener("click", ()=>window.print());

    document
        .getElementById("teacherInput")
        .addEventListener("keypress",e=>{

            if(e.key==="Enter"){
                searchTeacher();
            }

        });

    document
        .getElementById("daySelect")
        .addEventListener("change",changeDay);

}

/* ===========================================================
   LOAD DAYS.JSON
=========================================================== */

async function loadDays(){

    try{

        const response = await fetch(CONFIG.daysFile);

        if(!response.ok){

            throw new Error("Unable to load days.json");

        }

        const days = await response.json();

        const select = document.getElementById("daySelect");

        select.innerHTML="";

        days.forEach(day=>{

            const option=document.createElement("option");

            option.value=day;

            option.textContent=day;

            select.appendChild(option);

        });

        if(days.length>0){

            await loadCSV(days[0]);

        }

    }

    catch(error){

        showValidation(error.message);

    }

}

/* ===========================================================
   CHANGE DAY
=========================================================== */

async function changeDay(){

    const selected=document.getElementById("daySelect").value;

    await loadCSV(selected);

}

/* ===========================================================
   LOAD CSV
=========================================================== */

async function loadCSV(day){

    resetData();

    currentCSV = encodeURIComponent(day) + ".csv";

    document.getElementById("status").textContent="Loading "+currentCSV+"...";

    try{

        const response=await fetch(currentCSV);

        if(!response.ok){

            throw new Error("Unable to load "+currentCSV);

        }

        updateLastModified(response);

        const csvText=await response.text();

        const parsed=Papa.parse(csvText,{
            skipEmptyLines:false
        });

        rawCSV=parsed.data;

        validateCSV();

        parseTeacherSection();

parseExamSection();

parseExamPaperIndex();

parseDetailedDutySection();

buildTeacherSchedules();
        
        showSuccess(
            teacherNames.length+
            " teachers indexed • "+
            timeSlots.length+
            " time slots loaded"
        );

        document.getElementById("status").textContent=currentCSV+" loaded.";

        clearTable();

        document.getElementById("resultTitle").textContent="";

    }

    catch(error){

        showValidation(error.message);

    }

}

/* ===========================================================
   LAST MODIFIED
=========================================================== */

function updateLastModified(response){

    const last=response.headers.get("Last-Modified");

    if(!last){

        document.getElementById("lastUpdated").textContent=
        "Last Updated : Unknown";

        return;

    }

    const d=new Date(last);

    document.getElementById("lastUpdated").textContent=
        "Last Updated : "+
        d.toLocaleString("en-SG",{
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        });

}

/* ===========================================================
   RESET
=========================================================== */

function resetData(){

    rawCSV=[];

    teacherIndex = Object.create(null);;

    teacherSchedules={};

    teacherNames=[];

    examSchedule=[];

    examSections=[];

    examPapers=[];

dutyDetailsIndex=Object.create(null);

dutyVenueIndex=Object.create(null);

    timeSlots=[];

    teacherRow=-1;

    headerRow=-1;

    teacherStartRow=-1;

    examHeader=[];

    timeColumns=[];

    hideValidation();

    hideSuccess();

}

/* ===========================================================
   VALIDATION
=========================================================== */

function validateCSV(){

    teacherRow=findTeacherRow();

    if(teacherRow===-1){

        throw new Error(
            'Unable to locate the "Teacher" row.'
        );

    }

    headerRow=teacherRow-1;

    teacherStartRow=teacherRow+1;

}

/* ===========================================================
   FIND TEACHER ROW
=========================================================== */

function findTeacherRow(){

    for(let r=0;r<rawCSV.length;r++){

        const firstCell=(rawCSV[r][0]||"")
            .toString()
            .trim()
            .toLowerCase();

 if(firstCell.trim().toLowerCase().startsWith(CONFIG.teacherKeyword)){

            return r;

        }

    }

    return -1;

}

/* ===========================================================
   MESSAGE BOXES
=========================================================== */

function showValidation(message){

    const box=document.getElementById("validationBox");

    box.style.display="block";

    box.textContent=message;

}

function hideValidation(){

    document.getElementById("validationBox").style.display="none";

}

function showSuccess(message){

    const box=document.getElementById("successBox");

    box.style.display="block";

    box.textContent=message;

}

function hideSuccess(){

    document.getElementById("successBox").style.display="none";

}

/* ===========================================================
   TABLE HELPERS
=========================================================== */

function clearTable(){

    document.getElementById("tableHead").innerHTML="";

    document.getElementById("tableBody").innerHTML="";

    document.getElementById("suggestionBox").style.display="none";

}

/* ===========================================================
   PARSE TEACHER SECTION
=========================================================== */

function parseTeacherSection(){

    buildTimeSlots();

    buildTeacherIndex();

}

/* ===========================================================
   BUILD TIME SLOTS
=========================================================== */

function buildTimeSlots(){

    timeSlots=[];
    timeColumns=[];

    for(let c=1;c<rawCSV[teacherRow].length;c++){

        const endTime=(rawCSV[teacherRow][c]||"")
            .toString()
            .trim();

        if(endTime===""){

            break;

        }

        const startTime=(rawCSV[headerRow][c]||"")
            .toString()
            .trim();

        timeColumns.push(c);

        timeSlots.push({

            column:c,

            start:startTime,

            end:endTime

        });

    }

}

/* ===========================================================
   BUILD TEACHER INDEX
=========================================================== */

function buildTeacherIndex(){

    teacherIndex = Object.create(null);;

    teacherNames=[];

    for(let r=teacherStartRow;r<rawCSV.length;r++){

        const teacher=(rawCSV[r][0]||"")
            .toString()
            .trim();

if(teacher===""){

    continue;

}

        teacherIndex[normalise(teacher)]=r;

        teacherNames.push(teacher);

    }

}

/* ===========================================================
   BUILD TEACHER SCHEDULES
=========================================================== */

function buildTeacherSchedules(){

    teacherSchedules={};

    teacherNames.forEach(name=>{

        const row=teacherIndex[normalise(name)];

        const duties=[];

        timeSlots.forEach(slot=>{

            const value=(rawCSV[row][slot.column]||"")
                .toString()
                .trim();

            if(value===""){

                return;

            }

            if(value.toUpperCase()===CONFIG.lessonCode){

                return;

            }

const detail=findDutyDetail(

    name,

    slot.start,

    slot.end

);

duties.push({

    start:slot.start,

    end:slot.end,

    venue:value,

    detailedVenue:detail
        ? detail.venue
        : value,

    subject:detail
        ? detail.subject
        : "Paper not identified",

    hasDetail:Boolean(detail),

    nextInvigilator:"",

    column:slot.column

});

        });

        teacherSchedules[name]=mergeConsecutiveDuties(duties);

    });

    attachNextInvigilators();

}

/* ===========================================================
   MERGE CONSECUTIVE DUTIES
=========================================================== */

function mergeConsecutiveDuties(duties){

    if(duties.length===0){

        return [];

    }

    const merged=[];

    let current={...duties[0]};

    for(let i=1;i<duties.length;i++){

        const next=duties[i];

if(

    current.venue===next.venue &&

    current.detailedVenue===
    next.detailedVenue &&

    current.subject===
    next.subject

){

    current.end=next.end;

    current.column=next.column;

}

        else{

            merged.push(current);

            current={...next};

        }

    }

    merged.push(current);

    return merged;

}

/* ===========================================================
   FIND NEXT INVIGILATORS
=========================================================== */

function attachNextInvigilators(){

    Object.keys(teacherSchedules)
        .forEach(name=>{

            teacherSchedules[name]
                .forEach(duty=>{

                    if(duty.hasDetail){

                        duty.nextInvigilator=
                            findDetailedNextInvigilator(

                                duty.detailedVenue,

                                duty.end,

                                name

                            );

                    }

                    else{

                        duty.nextInvigilator=
                            findNextInvigilator(

                                duty.venue,

                                duty.column

                            );

                    }

                });

        });

}

/* ===========================================================
   NEXT INVIGILATOR
=========================================================== */

function findNextInvigilator(venue,lastColumn){

    const nextColumn=lastColumn+1;

    if(!timeColumns.includes(nextColumn)){

        return "-";

    }

    for(const teacher of teacherNames){

        const row=teacherIndex[normalise(teacher)];

        const value=(rawCSV[row][nextColumn]||"")
            .toString()
            .trim();

        if(value===venue){

            return teacher;

        }

    }

    return "-";

}

/* ===========================================================
   SEARCH
=========================================================== */

function searchTeacher(selectedName=null){

    clearTable();

    let name;

    if(selectedName){

        name=selectedName;

        document.getElementById("teacherInput").value=name;

    }

    else{

        name=document
            .getElementById("teacherInput")
            .value
            .trim();

    }

    if(name===""){

        return;

    }

    const teacher=findExactTeacher(name);

    if(!teacher){

        showSuggestions(name);

        document.getElementById("resultTitle").textContent=
        "No exact match found.";

        return;

    }

    displayTeacherSchedule(teacher);

}

/* ===========================================================
   FIND EXACT TEACHER
=========================================================== */

function findExactTeacher(input){

    const target=input
        .toUpperCase()
        .replace(/\s+/g,"");

    for(const teacher of teacherNames){

        const clean=teacher
            .toUpperCase()
            .replace(/\s+/g,"");

        if(clean===target){

            return teacher;

        }

    }

    return null;

}

/* ===========================================================
   SUGGESTIONS
=========================================================== */

function showSuggestions(input){

    const box=document.getElementById("suggestionBox");

    const links=document.getElementById("suggestionLinks");

    links.innerHTML="";

    const typed=input
        .toLowerCase()
        .replace(/\s+/g,"");

    const suggestions=teacherNames.filter(name=>{

        const lower=name.toLowerCase();

        const clean=lower.replace(/\s+/g,"");

        if(clean.includes(typed)){

            return true;

        }

        if(levenshtein(clean,typed)<=1){

            return true;

        }

        const parts=lower.split(" ");

        for(let i=0;i<parts.length;i++){

            let combine="";

            for(let j=i;j<parts.length;j++){

                combine+=parts[j];

                if(levenshtein(combine,typed)<=1){

                    return true;

                }

            }

        }

        return false;

    }).slice(0,5);

    if(suggestions.length===0){

        return;

    }

    box.style.display="block";

    suggestions.forEach(name=>{

        const span=document.createElement("span");

        span.className="suggestion";

        span.textContent=name;

        span.onclick=()=>searchTeacher(name);

        links.appendChild(span);

    });

}

/* ===========================================================
   LEVENSHTEIN
=========================================================== */

function levenshtein(a,b){

    const matrix=[];

    for(let i=0;i<=b.length;i++){

        matrix[i]=[i];

    }

    for(let j=0;j<=a.length;j++){

        matrix[0][j]=j;

    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(b.charAt(i-1)===a.charAt(j-1)){

                matrix[i][j]=matrix[i-1][j-1];

            }

            else{

                matrix[i][j]=Math.min(

                    matrix[i-1][j-1]+1,

                    matrix[i][j-1]+1,

                    matrix[i-1][j]+1

                );

            }

        }

    }

    return matrix[b.length][a.length];

}

/* ===========================================================
   DISPLAY TEACHER SCHEDULE
=========================================================== */

function displayTeacherSchedule(name){

    const head=document.getElementById(
        "tableHead"
    );

    const body=document.getElementById(
        "tableBody"
    );

    const duties=teacherSchedules[name]||[];

    document.getElementById(
        "resultTitle"
    ).textContent="Results for "+name;

    if(duties.length===0){

        head.innerHTML="";

        body.innerHTML=`
            <tr>
                <td colspan="4">
                    No invigilation duties found.
                </td>
            </tr>
        `;

        return;

    }

    head.innerHTML=`
        <tr>
            <th>Time</th>
            <th>Subject Paper</th>
            <th>Venue / Class</th>
            <th>Next Invigilator</th>
        </tr>
    `;

    body.innerHTML=duties.map(d=>`

        <tr>

            <td>
                ${escapeHTML(
                    formatTimeRange(
                        d.start,
                        d.end
                    )
                )}
            </td>

            <td class="subject-cell">
                ${escapeHTML(d.subject)}
            </td>

            <td class="venue-cell">
                ${escapeHTML(
                    d.detailedVenue
                )}
            </td>

            <td>
                ${escapeHTML(
                    d.nextInvigilator
                )}
            </td>

        </tr>

    `).join("");

}

function parseExamSection(){

    examSchedule=[];

    examSections=[];

    examHeader=[];

    let sessionRow=-1;

    /* Find the first row containing SESSION in any column */

    for(let r=0;r<teacherRow;r++){

        const containsSession=rawCSV[r].some(cell=>

            (cell||"")
                .toString()
                .trim()
                .toUpperCase()
                .startsWith("SESSION")

        );

        if(containsSession){

            sessionRow=r;

            break;

        }

    }

    if(sessionRow===-1){

        return;

    }

    const sessionCells=rawCSV[sessionRow];

    const headerCells=rawCSV[sessionRow+1]||[];

    const sessions=[];

    let c=0;

    /* Find each horizontal SESSION section */

    while(c<sessionCells.length){

        const title=(sessionCells[c]||"")
            .toString()
            .trim();

        if(!title.toUpperCase().startsWith("SESSION")){

            c++;

            continue;

        }

        const startColumn=c;

        c++;

        while(

            c<sessionCells.length &&

            (sessionCells[c]||"")
                .toString()
                .trim()
                .toUpperCase()===title.toUpperCase()

        ){

            c++;

        }

        sessions.push({

            title:title,

            start:startColumn,

            end:c-1

        });

    }

    if(sessions.length===0){

        return;

    }

    sessions.forEach((session,sessionIndex)=>{

        const columnMap=[];

        const seenHeaders=new Set();

        /* Build the columns and remove duplicated headers */

        for(

            let column=session.start;

            column<=session.end;

            column++

        ){

            const header=(headerCells[column]||"")
                .toString()
                .replace(/\s+/g," ")
                .trim();

            if(header===""){

                continue;

            }

            if(seenHeaders.has(header)){

                continue;

            }

            seenHeaders.add(header);

            columnMap.push({

                header:header,

                column:column

            });

        }

        /* Both sessions use the same display headers */

        if(sessionIndex===0){

            examHeader=[

                "Course",

                ...columnMap.map(item=>item.header)

            ];

        }

        const rows=[];

        /* Read the examination records */

        for(

            let r=sessionRow+2;

            r<teacherRow;

            r++

        ){

            const sourceRow=rawCSV[r]||[];

            const course=(sourceRow[0]||"")
                .toString()
                .trim();

            const hasSessionData=columnMap.some(item=>

                (sourceRow[item.column]||"")
                    .toString()
                    .trim()!==""

            );

            if(!course && !hasSessionData){

                if(rows.length>0){

                    break;

                }

                continue;

            }

            if(!hasSessionData){

                continue;

            }

            const record={};

            record["Course"]=course;

            columnMap.forEach(item=>{

                record[item.header]=
                    (sourceRow[item.column]||"")
                        .toString()
                        .trim();

            });

            rows.push(record);

        }

        examSections.push({

            title:session.title,

            rows:rows

        });

    });

}

/* ===========================================================
   EXAM PAPER AND DETAILED DUTY INDEX
=========================================================== */

function cleanCSVCell(value){

    return String(value||"")
        .replace(/\s+/g," ")
        .trim();

}

function getSessionBands(row){

    const bands=[];

    let column=0;

    while(column<row.length){

        const title=cleanCSVCell(row[column]);

        if(!title.toUpperCase().startsWith("SESSION")){

            column++;

            continue;

        }

        const start=column;

        column++;

        while(

            column<row.length &&

            cleanCSVCell(row[column]).toUpperCase()===
            title.toUpperCase()

        ){

            column++;

        }

        bands.push({

            title:title,

            start:start,

            end:column-1

        });

    }

    return bands;

}

function timeToMinutes(value){

    const match=String(value||"")
        .match(/(\d{1,2}):(\d{2})/);

    if(!match){

        return -1;

    }

    return Number(match[1])*60+Number(match[2]);

}

function extractClassCodes(value){

    return [

        ...new Set(

            String(value||"")
                .toUpperCase()
                .match(/\b4[A-Z]{2,4}\b/g)||[]

        )

    ];

}

function extractRoomCode(value){

    const match=String(value||"")
        .toUpperCase()
        .match(/\b[A-Z]\d{3}\b/);

    return match ? match[0] : "";

}

/* Read the official examination papers */

function parseExamPaperIndex(){

    examPapers=[];

    let sessionRow=-1;

    for(let r=0;r<teacherRow;r++){

        const hasSession=rawCSV[r].some(cell=>

            cleanCSVCell(cell)
                .toUpperCase()
                .startsWith("SESSION")

        );

        if(hasSession){

            sessionRow=r;

            break;

        }

    }

    if(sessionRow===-1){

        return;

    }

    const bands=getSessionBands(rawCSV[sessionRow]);

    bands.forEach(band=>{

        const headerCells=rawCSV[sessionRow+1]||[];

        const headerMap=Object.create(null);

        for(

            let column=band.start;

            column<=band.end;

            column++

        ){

            const header=cleanCSVCell(
                headerCells[column]
            ).toUpperCase();

            if(

                header &&

                headerMap[header]===undefined

            ){

                headerMap[header]=column;

            }

        }

        let started=false;

        for(

            let r=sessionRow+2;

            r<teacherRow;

            r++

        ){

            const row=rawCSV[r]||[];

            const hasData=row
                .slice(band.start,band.end+1)
                .some(cell=>cleanCSVCell(cell)!=="");

            if(!hasData){

                if(started){

                    break;

                }

                continue;

            }

            started=true;

            const timeText=cleanCSVCell(
                row[headerMap["TIME"]]
            );

            const times=String(timeText)
                .match(/\d{1,2}:\d{2}/g)||[];

            if(times.length<2){

                continue;

            }

            const subject=cleanCSVCell(
                row[headerMap["SUBJECT"]]
            );

            const examVenue=cleanCSVCell(
                row[headerMap["EXAM VENUE"]]
            );

            const aaRoom=cleanCSVCell(
                row[headerMap["AA ROOM"]]
            );

            const aaEndText=cleanCSVCell(
                row[headerMap["END TIME (AA ROOM)"]]
            );

            const aaTimes=String(aaEndText)
                .match(/\d{1,2}:\d{2}/g)||[];

            const end=timeToMinutes(times[1]);

            examPapers.push({

                session:band.title.toUpperCase(),

                course:cleanCSVCell(row[0]),

                subject:subject,

                examVenue:examVenue,

                aaRoom:aaRoom,

                start:timeToMinutes(times[0]),

                end:end,

                aaEnd:aaTimes.length
                    ? timeToMinutes(
                        aaTimes[aaTimes.length-1]
                    )
                    : end,

                classCodes:
                    extractClassCodes(examVenue)

            });

        }

    });

}

/* Read teacher names from the detailed duty table */

function parseDetailedDutySection(){

    dutyDetailsIndex=Object.create(null);

    dutyVenueIndex=Object.create(null);

    let detailRow=-1;

    for(let r=0;r<teacherRow-3;r++){

        const hasSession=rawCSV[r].some(cell=>

            cleanCSVCell(cell)
                .toUpperCase()
                .startsWith("SESSION")

        );

        if(!hasSession){

            continue;

        }

        const starts=rawCSV[r+2]||[];

        const ends=rawCSV[r+3]||[];

        let clockPairs=0;

        const width=Math.max(
            starts.length,
            ends.length
        );

        for(let c=0;c<width;c++){

            const startIsTime=
                /^\d{1,2}:\d{2}$/.test(
                    cleanCSVCell(starts[c])
                );

            const endIsTime=
                /^\d{1,2}:\d{2}$/.test(
                    cleanCSVCell(ends[c])
                );

            if(startIsTime && endIsTime){

                clockPairs++;

            }

        }

        if(clockPairs>=2){

            detailRow=r;

            break;

        }

    }

    if(detailRow===-1){

        return;

    }

    const bands=getSessionBands(
        rawCSV[detailRow]
    );

    const startRow=rawCSV[detailRow+2]||[];

    const endRow=rawCSV[detailRow+3]||[];

    const detailEnd=Math.max(
        detailRow+4,
        teacherRow-2
    );

    bands.forEach(band=>{

        const timeColumns=[];

        for(

            let column=band.start;

            column<=band.end;

            column++

        ){

            const startIsTime=
                /^\d{1,2}:\d{2}$/.test(
                    cleanCSVCell(startRow[column])
                );

            const endIsTime=
                /^\d{1,2}:\d{2}$/.test(
                    cleanCSVCell(endRow[column])
                );

            if(startIsTime && endIsTime){

                timeColumns.push(column);

            }

        }

        for(

            let r=detailRow+4;

            r<detailEnd;

            r++

        ){

            const row=rawCSV[r]||[];

            const detailedVenue=cleanCSVCell(
                row[band.start]
            );

            if(!detailedVenue){

                continue;

            }

            timeColumns.forEach(column=>{

                const teacher=cleanCSVCell(
                    row[column]
                );

                if(!teacher){

                    return;

                }

                const start=cleanCSVCell(
                    startRow[column]
                );

                const end=cleanCSVCell(
                    endRow[column]
                );

                const subject=matchDutySubjects(

                    band.title,

                    detailedVenue,

                    start,

                    end

                );

                const dutyKey=makeDutyDetailKey(

                    teacher,

                    start,

                    end

                );

                dutyDetailsIndex[dutyKey]={

                    venue:detailedVenue,

                    subject:subject

                };

                const venueKey=makeVenueSlotKey(

                    detailedVenue,

                    start

                );

                dutyVenueIndex[venueKey]=teacher;

            });

        }

    });

}

/* Match a detailed duty with its examination paper */

function matchDutySubjects(

    session,

    detailedVenue,

    start,

    end

){

    const venueCodes=
        extractClassCodes(detailedVenue);

    const venueRoom=
        extractRoomCode(detailedVenue);

    let candidates=examPapers.filter(paper=>{

        if(

            paper.session!==session.toUpperCase()

        ){

            return false;

        }

        const classMatch=venueCodes.some(code=>

            paper.classCodes.includes(code)

        );

        const aaRoom=
            extractRoomCode(paper.aaRoom);

        const aaMatch=

            aaRoom!=="" &&

            !paper.aaRoom
                .toUpperCase()
                .includes("NO AA") &&

            aaRoom===venueRoom;

        return classMatch||aaMatch;

    });

    /* Use time to separate papers sharing an AA room */

    if(candidates.length>1){

        const slotStart=timeToMinutes(start);

        const slotEnd=timeToMinutes(end);

        const overlapping=candidates.filter(
            paper=>{

                const aaMatch=

                    extractRoomCode(paper.aaRoom)===
                    venueRoom &&

                    !paper.aaRoom
                        .toUpperCase()
                        .includes("NO AA");

                const paperEnd=aaMatch
                    ? paper.aaEnd
                    : paper.end;

                return (

                    slotStart<paperEnd &&

                    slotEnd>paper.start

                );

            }
        );

        if(overlapping.length){

            candidates=overlapping;

        }

    }

    const subjects=candidates.map(paper=>

        specialiseLanguageSubject(

            paper.subject,

            detailedVenue

        )

    );

    return [

        ...new Set(subjects)

    ].join(" / ")||"Paper not identified";

}

/* Select Chinese, Malay or Tamil from a combined paper */

function specialiseLanguageSubject(

    subject,

    detailedVenue

){

    const languageTypes=new Set();

    extractClassCodes(detailedVenue)
        .forEach(code=>{

            if(/^4CL/.test(code)){

                languageTypes.add("CHINESE");

            }

            if(/^4ML/.test(code)){

                languageTypes.add("MALAY");

            }

            if(/^4TL/.test(code)){

                languageTypes.add("TAMIL");

            }

        });

    if(languageTypes.size!==1){

        return subject;

    }

    const language=[...languageTypes][0];

    const expression=new RegExp(

        "((?:BASIC\\s+)?"+

        language+

        " LANGUAGE PAPER\\s+\\d+)",

        "i"

    );

    const match=subject.match(expression);

    if(!match){

        return subject;

    }

    const notes=subject.match(
        /\([^)]*\)/g
    )||[];

    return [

        match[1],

        ...notes

    ].join(" ");

}

function makeDutyDetailKey(

    teacher,

    start,

    end

){

    return (

        normalise(teacher)+

        "|"+

        timeToMinutes(start)+

        "|"+

        timeToMinutes(end)

    );

}

function makeVenueSlotKey(

    venue,

    start

){

    return (

        normalise(venue)+

        "|"+

        timeToMinutes(start)

    );

}

function findDutyDetail(

    teacher,

    start,

    end

){

    const key=makeDutyDetailKey(

        teacher,

        start,

        end

    );

    return dutyDetailsIndex[key]||null;

}

function findDetailedNextInvigilator(

    venue,

    end,

    currentTeacher

){

    const key=makeVenueSlotKey(

        venue,

        end

    );

    const next=dutyVenueIndex[key];

    if(!next){

        return "-";

    }

    if(

        normalise(next)===
        normalise(currentTeacher)

    ){

        return "Continues";

    }

    return next;

}

                }

                tr.appendChild(td);

            });

        });

    });

}

/* ===========================================================
   SMALL HELPERS
=========================================================== */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

function normalise(text){

    return String(text)

        .trim()

        .toUpperCase()

        .replace(/\s+/g,"");

}

function formatTimeRange(start,end){

    return start+" - "+end;

}
