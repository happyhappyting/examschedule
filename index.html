<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAS(S) Exam Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>

:root{
    --blue:#004085;
    --gold:#f1c40f;
    --light:#f8f9fa;
    --border:#d9d9d9;
    --header:#eef3f8;
    --shadow:0 4px 15px rgba(0,0,0,.2);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--blue);
    color:#333;
}

.container{
    max-width:1500px;
    margin:auto;
}

.header{
    text-align:center;
    color:white;
    margin-bottom:18px;
}

.header h1{
    margin:0;
    color:var(--gold);
    letter-spacing:1px;
}

.header p{
    margin:8px 0;
    font-size:.9rem;
}

#lastUpdated{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    font-size:.8rem;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.form-row{
    display:flex;
    gap:15px;
    align-items:end;
    flex-wrap:wrap;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group label{
    font-weight:bold;
    color:var(--blue);
}

select,
input{
    padding:10px 12px;
    font-size:15px;
    border-radius:6px;
    border:1px solid var(--border);
}

select{
    min-width:220px;
}

input{
    min-width:260px;
    text-transform:uppercase;
}

.button-row{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:10px 18px;
    font-weight:bold;
    font-size:15px;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.primary{
    background:var(--gold);
    color:var(--blue);
}

.secondary{
    background:var(--blue);
    color:white;
}

.info-bar{
    margin:12px 0;
    color:white;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    font-size:.9rem;
}

#status{
    font-weight:bold;
}

#resultTitle{
    font-weight:bold;
}

#suggestionBox{
    display:none;
    margin-top:15px;
    background:#fff8db;
    border:1px solid #ecd27d;
    border-radius:8px;
    padding:12px;
}

#suggestionBox strong{
    display:block;
    margin-bottom:10px;
}

#suggestionLinks{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.suggestion{
    padding:6px 12px;
    border-radius:20px;
    background:white;
    border:1px solid var(--blue);
    color:var(--blue);
    cursor:pointer;
    font-size:.9rem;
}

.suggestion:hover{
    background:var(--blue);
    color:white;
}

#tableWrapper{
    background:white;
    border-radius:10px;
    overflow:auto;
    max-height:76vh;
    box-shadow:var(--shadow);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

thead th{
    position:sticky;
    top:0;
    z-index:30;
    background:var(--header);
    color:var(--blue);
    border-bottom:2px solid var(--blue);
}

th,
td{
    border:1px solid #ececec;
    padding:8px 10px;
    font-size:14px;
    white-space:nowrap;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

.sticky-column{
    position:sticky;
    left:0;
    background:white;
    z-index:20;
    font-weight:bold;
}

thead .sticky-column{
    z-index:40;
    background:var(--header);
}

.session-title{
    background:var(--blue);
    color:white;
    font-weight:bold;
    padding:10px;
    margin-top:18px;
    border-radius:6px 6px 0 0;
}

.validation{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    background:#ffeaea;
    color:#a40000;
    border:1px solid #ffbcbc;
}

.success{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    background:#edfceb;
    color:#186b18;
    border:1px solid #9ed39e;
}

.warning{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    background:#fff8db;
    color:#755800;
    border:1px solid #ecd27d;
}

@media print{

body{
    background:white;
}

.header,
.card,
#suggestionBox,
.validation,
.success{
    display:none!important;
}

#tableWrapper{
    max-height:none;
    overflow:visible;
    box-shadow:none;
}

}

@media(max-width:768px){

body{
    padding:10px;
}

.form-row{
    flex-direction:column;
    align-items:stretch;
}

.form-group{
    width:100%;
}

select,
input{
    width:100%;
    min-width:unset;
}

.button-row{
    flex-direction:column;
}

button{
    width:100%;
}

.info-bar{
    flex-direction:column;
}

th,
td{
    font-size:13px;
}

}

/* CUSTOM DISPLAY IMPROVEMENTS */

/* Hide the CSV loaded message */
#status{
    display:none;
}

/* Centre the search controls and buttons */
.form-row,
.button-row{
    justify-content:center;
}

/* Centre labels and entered information */
.form-group label,
select,
input{
    text-align:center;
}

/* Centre the result heading */
.info-bar{
    justify-content:center;
}

#resultTitle{
    width:100%;
    text-align:center;
}

/* Centre table content and use clear black borders */
th,
td{
    text-align:center;
    border:1px solid #000;
}

/* Subject and detailed venue columns */

.subject-cell{
    white-space:normal;
    min-width:280px;
    line-height:1.4;
}

.venue-cell{
    white-space:normal;
    min-width:180px;
    line-height:1.4;
}

.duty-stage{
    display:inline-block;
    min-width:58px;
    padding:4px 8px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
}

.duty-stage.start{
    background:#dff4ff;
    color:#005b87;
    border:1px solid #8fd4f2;
}

.duty-stage.end{
    background:#ffe5e5;
    color:#9a1515;
    border:1px solid #efaaaa;
}

.duty-stage.start-end{
    background:#efe4ff;
    color:#5e2697;
    border:1px solid #c5a3e9;
}

.duty-stage.middle{
    background:#f1f1f1;
    color:#666;
    border:1px solid #d5d5d5;
}

</style>

</head>

<script>

/* ===========================================================
   CONFIG
=========================================================== */

const CONFIG={
    daysFile:"days.json",
    teacherKeyword:"teacher"
};

/* ===========================================================
   GLOBAL DATA
=========================================================== */

let rawCSV=[];
let currentCSV="";
let teacherRow=-1;
let headerRow=-1;
let officialSessionRow=-1;
let detailedSessionRow=-1;

let teacherNames=[];
let teacherLookup=Object.create(null);
let teacherSchedules=Object.create(null);

let examHeader=[];
let examSections=[];
let examPapers=[];

let detailedVenueRows=0;
let dutySegments=0;
let dataWarnings=[];

/* ===========================================================
   INITIALIZATION AND EVENTS
=========================================================== */

window.addEventListener("load",initialise);

async function initialise(){
    registerEvents();
    await loadDays();
}

function registerEvents(){
    document.getElementById("btnSearch")
        .addEventListener("click",()=>searchTeacher());

    document.getElementById("btnExam")
        .addEventListener("click",displayExamSchedule);

    document.getElementById("btnMaster")
        .addEventListener("click",displayMasterView);

    document.getElementById("btnPrint")
        .addEventListener("click",()=>window.print());

    document.getElementById("teacherInput")
        .addEventListener("keypress",event=>{
            if(event.key==="Enter"){
                searchTeacher();
            }
        });

    document.getElementById("daySelect")
        .addEventListener("change",changeDay);
}

/* ===========================================================
   FILE LOADING
=========================================================== */

async function loadDays(){
    try{
        const response=await fetch(CONFIG.daysFile);

        if(!response.ok){
            throw new Error("Unable to load days.json");
        }

        const days=await response.json();
        const select=document.getElementById("daySelect");
        select.innerHTML="";

        days.forEach(day=>{
            const option=document.createElement("option");
            option.value=day;
            option.textContent=day;
            select.appendChild(option);
        });

        if(days.length){
            await loadCSV(days[0]);
        }
    }
    catch(error){
        showValidation(error.message);
    }
}

async function changeDay(){
    const selected=document.getElementById("daySelect").value;
    await loadCSV(selected);
}

async function loadCSV(day){
    resetData();
    currentCSV=encodeURIComponent(day)+".csv";
    document.getElementById("status").textContent="Loading...";

    try{
        const response=await fetch(currentCSV);

        if(!response.ok){
            throw new Error("Unable to load "+currentCSV);
        }

        updateLastModified(response);

        const csvText=await response.text();
        const parsed=Papa.parse(csvText,{skipEmptyLines:false});

        if(parsed.errors && parsed.errors.length){
            throw new Error("CSV parsing error: "+parsed.errors[0].message);
        }

        rawCSV=parsed.data;

        locateSections();
        buildCanonicalTeacherDirectory();
        parseExamSchedule();
        parseExamPaperIndex();
        buildSchedulesFromDetailedTable();
        finaliseTeacherDirectory();

        showSuccess(
            teacherNames.length+
            " teachers indexed • "+
            dutySegments+
            " duties loaded • "+
            detailedVenueRows+
            " venue/class groups"
        );

        if(dataWarnings.length){
            showWarning(dataWarnings.join(" | "));
        }

        document.getElementById("status").textContent="";
        document.getElementById("resultTitle").textContent="";
        clearTable();
    }
    catch(error){
        document.getElementById("status").textContent="";
        showValidation(error.message);
    }
}

function updateLastModified(response){
    const last=response.headers.get("Last-Modified");

    if(!last){
        document.getElementById("lastUpdated").textContent=
            "Last Updated : Unknown";
        return;
    }

    const date=new Date(last);
    document.getElementById("lastUpdated").textContent=
        "Last Updated : "+date.toLocaleString("en-SG",{
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        });
}

function resetData(){
    rawCSV=[];
    teacherRow=-1;
    headerRow=-1;
    officialSessionRow=-1;
    detailedSessionRow=-1;

    teacherNames=[];
    teacherLookup=Object.create(null);
    teacherSchedules=Object.create(null);

    examHeader=[];
    examSections=[];
    examPapers=[];

    detailedVenueRows=0;
    dutySegments=0;
    dataWarnings=[];

    hideValidation();
    hideWarning();
    hideSuccess();
}

/* ===========================================================
   SECTION LOCATION
=========================================================== */

function locateSections(){
    teacherRow=findTeacherRow();
    headerRow=teacherRow>0 ? teacherRow-1 : -1;
    officialSessionRow=findOfficialSessionRow();
    detailedSessionRow=findDetailedSessionRow();

    if(officialSessionRow===-1){
        throw new Error("Unable to locate the official Session table.");
    }

    if(detailedSessionRow===-1){
        throw new Error("Unable to locate the detailed Session duty table.");
    }
}

function findTeacherRow(){
    for(let row=0;row<rawCSV.length;row++){
        const first=cleanCSVCell(rawCSV[row][0]).toLowerCase();
        if(first.startsWith(CONFIG.teacherKeyword)){
            return row;
        }
    }
    return -1;
}

function rowContainsSession(row){
    return (row||[]).some(cell=>
        cleanCSVCell(cell).toUpperCase().startsWith("SESSION")
    );
}

function findOfficialSessionRow(){
    const limit=teacherRow===-1 ? rawCSV.length : teacherRow;

    for(let row=0;row<limit-1;row++){
        if(!rowContainsSession(rawCSV[row])){
            continue;
        }

        const headers=(rawCSV[row+1]||[])
            .map(cell=>cleanCSVCell(cell).toUpperCase());

        if(headers.includes("TIME") && headers.includes("SUBJECT")){
            return row;
        }
    }
    return -1;
}

function findDetailedSessionRow(){
    const limit=teacherRow===-1 ? rawCSV.length : teacherRow;

    for(let row=0;row<limit-3;row++){
        if(!rowContainsSession(rawCSV[row])){
            continue;
        }

        const starts=rawCSV[row+2]||[];
        const ends=rawCSV[row+3]||[];
        const width=Math.max(starts.length,ends.length);
        let pairs=0;

        for(let column=0;column<width;column++){
            if(isClock(starts[column]) && isClock(ends[column])){
                pairs++;
            }
        }

        if(pairs>=2){
            return row;
        }
    }
    return -1;
}

/* ===========================================================
   CANONICAL TEACHER DIRECTORY
   Only the first column of the bottom table is used.
=========================================================== */

function buildCanonicalTeacherDirectory(){
    if(teacherRow===-1){
        return;
    }

    for(let row=teacherRow+1;row<rawCSV.length;row++){
        const rawName=cleanCSVCell(rawCSV[row][0]);

        if(!rawName){
            break;
        }

        addCanonicalTeacher(cleanTeacherDisplayName(rawName));
    }
}

function addCanonicalTeacher(name){
    const display=cleanTeacherDisplayName(name);
    const key=personKey(display);

    if(!display || !key){
        return "";
    }

    if(!teacherLookup[key]){
        teacherLookup[key]=display;
        teacherNames.push(display);
        teacherSchedules[display]=[];
    }

    return teacherLookup[key];
}

function resolveDetailedTeacher(value){
    const cell=cleanCSVCell(value);

    if(!cell){
        return "";
    }

    const target=personKey(cell);
    const candidates=teacherNames
        .filter(name=>target.startsWith(personKey(name)))
        .sort((a,b)=>personKey(b).length-personKey(a).length);

    if(candidates.length){
        return candidates[0];
    }

    let cleaned=cell
        .replace(/\s*[\-(（(]?\s*END\s+(?:AA\s+)?PAPER.*$/i,"")
        .replace(/\s*[\-(（(]?\s*END\s+AA.*$/i,"")
        .replace(/\s*\*+\s*$/,"")
        .trim();

    return addCanonicalTeacher(cleaned);
}

function cleanTeacherDisplayName(value){
    return cleanCSVCell(value)
        .replace(/\s*\*+\s*$/,"")
        .trim();
}

function finaliseTeacherDirectory(){
    teacherNames.sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}));
    teacherNames.forEach(name=>{
        teacherSchedules[name]=(teacherSchedules[name]||[])
            .sort((a,b)=>
                a.startMinutes-b.startMinutes ||
                a.venue.localeCompare(b.venue)
            );
    });
}

/* ===========================================================
   OFFICIAL EXAM SCHEDULE DISPLAY
=========================================================== */

function parseExamSchedule(){
    examHeader=[];
    examSections=[];

    const bands=getSessionBands(rawCSV[officialSessionRow]||[]);
    const headerCells=rawCSV[officialSessionRow+1]||[];

    bands.forEach((band,index)=>{
        const columnMap=buildUniqueHeaderMap(headerCells,band);

        if(index===0){
            examHeader=["Course",...columnMap.map(item=>item.header)];
        }

        const records=[];
        let started=false;

        for(let row=officialSessionRow+2;row<rawCSV.length;row++){
            const source=rawCSV[row]||[];
            const hasData=columnMap.some(item=>
                cleanCSVCell(source[item.column])!==""
            );

            if(!hasData){
                if(started){
                    break;
                }
                continue;
            }

            started=true;
            const record={Course:cleanCSVCell(source[0])};

            columnMap.forEach(item=>{
                record[item.header]=cleanCSVCell(source[item.column]);
            });

            records.push(record);
        }

        examSections.push({title:band.title,rows:records});
    });
}

function buildUniqueHeaderMap(headerCells,band){
    const output=[];
    const seen=new Set();

    for(let column=band.start;column<=band.end;column++){
        const header=cleanCSVCell(headerCells[column]);

        if(!header || seen.has(header.toUpperCase())){
            continue;
        }

        seen.add(header.toUpperCase());
        output.push({header:header,column:column});
    }

    return output;
}

/* ===========================================================
   OFFICIAL PAPER INDEX
=========================================================== */

function parseExamPaperIndex(){
    examPapers=[];

    const bands=getSessionBands(rawCSV[officialSessionRow]||[]);
    const headerCells=rawCSV[officialSessionRow+1]||[];

    bands.forEach(band=>{
        const headerMap=Object.create(null);

        for(let column=band.start;column<=band.end;column++){
            const header=cleanCSVCell(headerCells[column]).toUpperCase();
            if(header && headerMap[header]===undefined){
                headerMap[header]=column;
            }
        }

        let started=false;

        for(let row=officialSessionRow+2;row<rawCSV.length;row++){
            const source=rawCSV[row]||[];
            const hasData=source.slice(band.start,band.end+1)
                .some(cell=>cleanCSVCell(cell)!=="");

            if(!hasData){
                if(started){
                    break;
                }
                continue;
            }

            started=true;

            const timeText=cleanCSVCell(source[headerMap["TIME"]]);
            const times=timeText.match(/\d{1,2}:\d{2}/g)||[];
            const subject=cleanCSVCell(source[headerMap["SUBJECT"]]);

            if(times.length<2 || !subject || subject.toUpperCase()==="NO PAPER"){
                continue;
            }

            const examVenue=cleanCSVCell(source[headerMap["EXAM VENUE"]]);
            const aaRoom=cleanCSVCell(source[headerMap["AA ROOM"]]);
            const aaEndText=cleanCSVCell(source[headerMap["END TIME (AA ROOM)"]]);
            const aaTimes=aaEndText.match(/\d{1,2}:\d{2}/g)||[];
            const end=timeToMinutes(times[1]);

            examPapers.push({
                session:normaliseSession(band.title),
                course:cleanCSVCell(source[0]),
                subject:subject,
                examVenue:examVenue,
                aaRoom:aaRoom,
                start:timeToMinutes(times[0]),
                end:end,
                aaEnd:aaTimes.length
                    ? timeToMinutes(aaTimes[aaTimes.length-1])
                    : end,
                classCodes:extractClassCodes(examVenue),
                roomCodes:extractRoomCodes(examVenue),
                aaRoomCodes:extractRoomCodes(aaRoom)
            });
        }
    });
}

/* ===========================================================
   AUTHORITATIVE DETAILED DUTY TABLE
=========================================================== */

function buildSchedulesFromDetailedTable(){
    const bands=getSessionBands(rawCSV[detailedSessionRow]||[]);
    const startRow=rawCSV[detailedSessionRow+2]||[];
    const endRow=rawCSV[detailedSessionRow+3]||[];
    const detailEnd=findDetailedTableEnd(bands);

    bands.forEach(band=>{
        const timeColumns=[];

        for(let column=band.start;column<=band.end;column++){
            if(isClock(startRow[column]) && isClock(endRow[column])){
                timeColumns.push(column);
            }
        }

        if(!timeColumns.length){
            return;
        }

        const venueColumn=timeColumns[0]-1;

        for(let row=detailedSessionRow+4;row<detailEnd;row++){
            const source=rawCSV[row]||[];
            const venue=cleanCSVCell(source[venueColumn]);

            if(!venue){
                continue;
            }

            const occupied=timeColumns.filter(column=>
                cleanCSVCell(source[column])!==""
            );

            if(!occupied.length){
                continue;
            }

            detailedVenueRows++;

            const rowStart=timeToMinutes(startRow[occupied[0]]);
            const rowEnd=timeToMinutes(endRow[occupied[occupied.length-1]]);
            const papers=matchPapersToVenueRow(
                band.title,
                venue,
                rowStart,
                rowEnd
            );

            const cells=occupied.map((column,index)=>({
                teacher:resolveDetailedTeacher(source[column]),
                start:cleanCSVCell(startRow[column]),
                end:cleanCSVCell(endRow[column]),
                startMinutes:timeToMinutes(startRow[column]),
                endMinutes:timeToMinutes(endRow[column]),
                subject:subjectForDutySlot(
                    papers,
                    venue,
                    timeToMinutes(startRow[column]),
                    timeToMinutes(endRow[column])
                ),
                isStart:index===0,
                isEnd:index===occupied.length-1
            }));

            addDutySegmentsForVenueRow(cells,venue);
        }
    });
}

function findDetailedTableEnd(bands){
    const start=detailedSessionRow+4;
    const lower=Math.min(...bands.map(band=>band.start));
    const upper=Math.max(...bands.map(band=>band.end));
    let blankRows=0;

    for(let row=start;row<rawCSV.length;row++){
        const hasData=(rawCSV[row]||[])
            .slice(lower,upper+1)
            .some(cell=>cleanCSVCell(cell)!=="");

        blankRows=hasData ? 0 : blankRows+1;

        if(blankRows>=2){
            return row-1;
        }

        if(teacherRow!==-1 && row>=teacherRow-2){
            return teacherRow-2;
        }
    }

    return teacherRow!==-1 ? teacherRow-2 : rawCSV.length;
}

function matchPapersToVenueRow(session,venue,rowStart,rowEnd){
    const sessionKey=normaliseSession(session);
    const classCodes=extractClassCodes(venue);
    const roomCodes=extractRoomCodes(venue);

    let candidates=examPapers.filter(paper=>{
        if(paper.session!==sessionKey){
            return false;
        }

        const classMatch=classCodes.some(code=>paper.classCodes.includes(code));
        const aaMatch=roomCodes.some(room=>paper.aaRoomCodes.includes(room));
        return classMatch || aaMatch;
    });

    if(!candidates.length){
        candidates=examPapers.filter(paper=>
            paper.session===sessionKey &&
            rowStart<paperDutyEnd(paper,roomCodes) &&
            rowEnd>paper.start
        );

        if(candidates.length===1){
            addDataWarning(
                session+" / "+venue+
                " was matched by time because its class group was missing from Exam Venue."
            );
        }
    }

    return candidates;
}

function subjectForDutySlot(papers,venue,slotStart,slotEnd){
    if(!papers.length){
        return "Schedule mismatch – check CSV";
    }

    const roomCodes=extractRoomCodes(venue);
    let selected=papers;

    if(papers.length>1){
        const overlapping=papers.filter(paper=>
            slotStart<paperDutyEnd(paper,roomCodes) &&
            slotEnd>paper.start
        );

        if(overlapping.length){
            selected=overlapping;
        }
    }

    const subjects=selected.map(paper=>
        specialiseLanguageSubject(paper.subject,venue)
    );

    return [...new Set(subjects)].join(" / ");
}

function paperDutyEnd(paper,venueRooms){
    const isAA=venueRooms.some(room=>paper.aaRoomCodes.includes(room));
    return isAA ? paper.aaEnd : paper.end;
}

function specialiseLanguageSubject(subject,venue){
    const codes=extractClassCodes(venue);
    const languages=[];

    if(codes.some(code=>/^4CL/.test(code))){
        languages.push("CHINESE");
    }
    if(codes.some(code=>/^4ML/.test(code))){
        languages.push("MALAY");
    }
    if(codes.some(code=>/^4TL/.test(code))){
        languages.push("TAMIL");
    }

    if(!languages.length){
        return subject;
    }

    const selected=[];

    languages.forEach(language=>{
        const expression=new RegExp(
            "((?:BASIC\\s+)?"+
            language+
            "(?:\\s+LANGUAGE)?\\s+PAPER\\s+\\d+)",
            "i"
        );
        const match=subject.match(expression);
        if(match){
            selected.push(match[1]);
        }
    });

    if(!selected.length){
        return subject;
    }

    const notes=subject.match(/\([^)]*\)/g)||[];
    return selected.join(" / ")+(notes.length ? " "+notes.join(" ") : "");
}

function addDutySegmentsForVenueRow(cells,venue){
    if(!cells.length){
        return;
    }

    let current=createSegment(cells[0],venue);

    for(let index=1;index<cells.length;index++){
        const cell=cells[index];
        const continuous=current.endMinutes===cell.startMinutes;

        if(
            continuous &&
            current.teacher===cell.teacher &&
            current.subject===cell.subject
        ){
            current.end=cell.end;
            current.endMinutes=cell.endMinutes;
            current.isEnd=current.isEnd || cell.isEnd;
            continue;
        }

        current.nextInvigilator=
            current.teacher===cell.teacher ? "Continues" : cell.teacher;
        saveDutySegment(current);
        current=createSegment(cell,venue);
    }

    current.nextInvigilator="-";
    saveDutySegment(current);
}

function createSegment(cell,venue){
    return {
        teacher:cell.teacher,
        start:cell.start,
        end:cell.end,
        startMinutes:cell.startMinutes,
        endMinutes:cell.endMinutes,
        subject:cell.subject,
        venue:venue,
        isStart:cell.isStart,
        isEnd:cell.isEnd,
        nextInvigilator:"-"
    };
}

function saveDutySegment(segment){
    if(!segment.teacher){
        return;
    }

    if(!teacherSchedules[segment.teacher]){
        addCanonicalTeacher(segment.teacher);
    }

    teacherSchedules[segment.teacher].push(segment);
    dutySegments++;
}

/* ===========================================================
   SEARCH AND SUGGESTIONS
=========================================================== */

function searchTeacher(selectedName=null){
    clearTable();

    const input=document.getElementById("teacherInput");
    const name=selectedName || input.value.trim();

    if(!name){
        return;
    }

    const teacher=findExactTeacher(name);

    if(!teacher){
        showSuggestions(name);
        document.getElementById("resultTitle").textContent=
            "No exact match found.";
        return;
    }

    input.value=teacher;
    displayTeacherSchedule(teacher);
}

function findExactTeacher(input){
    return teacherLookup[personKey(input)]||null;
}

function showSuggestions(input){
    const box=document.getElementById("suggestionBox");
    const links=document.getElementById("suggestionLinks");
    links.innerHTML="";

    const typed=personKey(input);
    const suggestions=teacherNames.filter(name=>{
        const candidate=personKey(name);
        return candidate.includes(typed) || levenshtein(candidate,typed)<=1;
    }).slice(0,5);

    if(!suggestions.length){
        box.style.display="none";
        return;
    }

    box.style.display="block";

    suggestions.forEach(name=>{
        const span=document.createElement("span");
        span.className="suggestion";
        span.textContent=name;
        span.onclick=()=>searchTeacher(name);
        links.appendChild(span);
    });
}

function levenshtein(a,b){
    const matrix=[];

    for(let row=0;row<=b.length;row++){
        matrix[row]=[row];
    }
    for(let column=0;column<=a.length;column++){
        matrix[0][column]=column;
    }

    for(let row=1;row<=b.length;row++){
        for(let column=1;column<=a.length;column++){
            matrix[row][column]=b.charAt(row-1)===a.charAt(column-1)
                ? matrix[row-1][column-1]
                : Math.min(
                    matrix[row-1][column-1]+1,
                    matrix[row][column-1]+1,
                    matrix[row-1][column]+1
                );
        }
    }

    return matrix[b.length][a.length];
}

/* ===========================================================
   DISPLAY TEACHER SCHEDULE
=========================================================== */

function displayTeacherSchedule(name){
    const head=document.getElementById("tableHead");
    const body=document.getElementById("tableBody");
    const duties=teacherSchedules[name]||[];

    document.getElementById("resultTitle").textContent="Results for "+name;

    if(!duties.length){
        head.innerHTML="";
        body.innerHTML='<tr><td colspan="5">No invigilation duties found.</td></tr>';
        return;
    }

    head.innerHTML=`
        <tr>
            <th>Time</th>
            <th>Duty Stage</th>
            <th>Subject Paper</th>
            <th>Venue / Class</th>
            <th>Next Invigilator</th>
        </tr>
    `;

    body.innerHTML=duties.map(duty=>dutyRowHTML(duty,false)).join("");
}

function dutyRowHTML(duty,includeTeacher){
    return `
        <tr>
            ${includeTeacher ? `<td>${escapeHTML(duty.teacher)}</td>` : ""}
            <td>${escapeHTML(formatTimeRange(duty.start,duty.end))}</td>
            <td>${dutyStageHTML(duty)}</td>
            <td class="subject-cell">${escapeHTML(duty.subject)}</td>
            <td class="venue-cell">${escapeHTML(duty.venue)}</td>
            <td>${escapeHTML(duty.nextInvigilator)}</td>
        </tr>
    `;
}

function dutyStageHTML(duty){
    if(duty.isStart && duty.isEnd){
        return '<span class="duty-stage start-end">START &amp; END</span>';
    }
    if(duty.isStart){
        return '<span class="duty-stage start">START</span>';
    }
    if(duty.isEnd){
        return '<span class="duty-stage end">END</span>';
    }
    return '<span class="duty-stage middle">—</span>';
}

/* ===========================================================
   DISPLAY OFFICIAL EXAM SCHEDULE
=========================================================== */

function displayExamSchedule(){
    clearTable();
    document.getElementById("resultTitle").textContent="Examination Schedule";

    const head=document.getElementById("tableHead");
    const body=document.getElementById("tableBody");
    head.innerHTML="";
    body.innerHTML="";

    if(!examSections.length){
        body.innerHTML="<tr><td>No examination schedule found.</td></tr>";
        return;
    }

    examSections.forEach(section=>{
        const sessionRow=document.createElement("tr");
        const sessionCell=document.createElement("td");
        sessionCell.colSpan=examHeader.length;
        sessionCell.textContent=section.title;
        sessionCell.style.background="#004085";
        sessionCell.style.color="white";
        sessionCell.style.fontWeight="bold";
        sessionCell.style.fontSize="15px";
        sessionRow.appendChild(sessionCell);
        body.appendChild(sessionRow);

        const heading=document.createElement("tr");
        examHeader.forEach((header,index)=>{
            const th=document.createElement("th");
            th.textContent=header;
            if(index===0){
                th.classList.add("sticky-column");
            }
            heading.appendChild(th);
        });
        body.appendChild(heading);

        section.rows.forEach(record=>{
            const row=document.createElement("tr");
            examHeader.forEach((header,index)=>{
                const cell=document.createElement("td");
                cell.textContent=record[header]||"";
                if(index===0){
                    cell.classList.add("sticky-column");
                }
                row.appendChild(cell);
            });
            body.appendChild(row);
        });
    });
}

/* ===========================================================
   FULL MASTER VIEW FROM THE DETAILED SESSION TABLE
=========================================================== */

function displayMasterView(){
    clearTable();
    document.getElementById("resultTitle").textContent="Full Master View";

    const head=document.getElementById("tableHead");
    const body=document.getElementById("tableBody");

    head.innerHTML=`
        <tr>
            <th>Teacher</th>
            <th>Time</th>
            <th>Duty Stage</th>
            <th>Subject Paper</th>
            <th>Venue / Class</th>
            <th>Next Invigilator</th>
        </tr>
    `;

    const duties=[];
    teacherNames.forEach(name=>{
        (teacherSchedules[name]||[]).forEach(duty=>duties.push(duty));
    });

    duties.sort((a,b)=>
        a.startMinutes-b.startMinutes ||
        a.venue.localeCompare(b.venue) ||
        a.teacher.localeCompare(b.teacher)
    );

    body.innerHTML=duties.length
        ? duties.map(duty=>dutyRowHTML(duty,true)).join("")
        : '<tr><td colspan="6">No invigilation duties found.</td></tr>';
}

/* ===========================================================
   SMALL HELPERS
=========================================================== */

function cleanCSVCell(value){
    return String(value||"").replace(/\s+/g," ").trim();
}

function personKey(value){
    return String(value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

function normaliseSession(value){
    return cleanCSVCell(value).toUpperCase();
}

function isClock(value){
    return /^\d{1,2}:\d{2}$/.test(cleanCSVCell(value));
}

function timeToMinutes(value){
    const match=String(value||"").match(/(\d{1,2}):(\d{2})/);
    return match ? Number(match[1])*60+Number(match[2]) : -1;
}

function getSessionBands(row){
    const bands=[];
    let column=0;

    while(column<row.length){
        const title=cleanCSVCell(row[column]);

        if(!title.toUpperCase().startsWith("SESSION")){
            column++;
            continue;
        }

        const start=column;
        column++;

        while(
            column<row.length &&
            cleanCSVCell(row[column]).toUpperCase()===title.toUpperCase()
        ){
            column++;
        }

        bands.push({title:title,start:start,end:column-1});
    }

    return bands;
}

function extractClassCodes(value){
    return [...new Set(
        String(value||"").toUpperCase().match(/\b4[A-Z]{2,4}\b/g)||[]
    )];
}

function extractRoomCodes(value){
    return [...new Set(
        String(value||"").toUpperCase().match(/\b[A-Z]\d{3}\b/g)||[]
    )];
}

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatTimeRange(start,end){
    return start+" - "+end;
}
